# Copyright © 2026 Dagitali LLC. All rights reserved.
#
# GitHub Actions workflow for tagged action releases.
#
# Responsibilities
# - Validate the tagged repository action before publication.
# - Publish a GitHub Release for immutable action-version tags.
#
# Maintainer Notes
# - GitHub Release note categories are configured separately in
#   `.github/release.yml`.
# - This repository publishes a GitHub Action from source tags; it does not
#   build or publish Python distributions.
# - Global permissions are intentionally omitted; each job declares the minimum
#   permissions it needs.
# - External GitHub Actions are pinned to full commit SHAs to reduce
#   supply-chain risk.
# - The dynamic run name is part of the workflow contract: it should identify
#   the tagged version for release clarity.
#
# References
# - GitHub Actions metadata syntax: https://docs.github.com/en/actions/sharing-automations/creating-actions/metadata-syntax-for-github-actions
# - GitHub Release documentation: https://docs.github.com/en/repositories/releasing-projects
# - GitHub Actions expressions reference: https://docs.github.com/en/actions/learn-github-actions/expressions
# - GitHub Actions security hardening guide: https://docs.github.com/en/actions/security-guides/security-hardening-for-github-actions
# - GitHub Actions workflow syntax reference: https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions

---

name: Release

run-name: Release ${{ github.ref_name }}

on:
  push:
    tags: ['v*.*.*']

permissions: {}

jobs:
  validate-tagged-action:
    name: Validate tagged action with ${{ matrix.installer }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        installer: [pip, pipx, uv]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # Pinned v7.0.0
      - name: Build fixture wheel
        shell: bash
        run: |
          set -euo pipefail

          fixture_dir="${RUNNER_TEMP}/installer-smoke-fixture"
          mkdir -p "$fixture_dir/src/installer_smoke_fixture"

          cat > "$fixture_dir/pyproject.toml" <<'TOML'
          [build-system]
          requires = ["setuptools>=69", "wheel"]
          build-backend = "setuptools.build_meta"

          [project]
          name = "installer-smoke-fixture"
          version = "0.1.0"

          [project.scripts]
          installer-smoke-fixture = "installer_smoke_fixture.cli:main"
          TOML

          cat > "$fixture_dir/src/installer_smoke_fixture/__init__.py" <<'PY'
          __all__ = []
          PY

          cat > "$fixture_dir/src/installer_smoke_fixture/cli.py" <<'PY'
          def main() -> None:
              print("installer-smoke-fixture ok")
          PY

          python -m pip install --upgrade build
          python -m build --wheel --outdir dist "$fixture_dir"
      - name: Run local action with ${{ matrix.installer }}
        uses: ./
        with:
          artifact-wheel: dist/installer_smoke_fixture-0.1.0-py3-none-any.whl
          command-name: installer-smoke-fixture
          installer-smoke-installers: ${{ matrix.installer }}
          package-name: installer-smoke-fixture
          smoke-commands: |
            installer-smoke-fixture

  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: [validate-tagged-action]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # Pinned v7.0.0
      - name: Publish GitHub release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b  # Pinned v3.0.1
        with:
          generate_release_notes: true
